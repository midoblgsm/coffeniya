name: Deploy to production

on:
  push:
    branches: [main]

# Queue production deploys instead of cancelling one mid-flight.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

jobs:
  deploy:
    name: Build & deploy everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            functions/package-lock.json

      - name: Install root dependencies (firebase-tools)
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Unit tests (safety gate)
        run: |
          npm --prefix web test
          npm --prefix functions test

      - name: Build web
        run: npm run build
        working-directory: web

      # Exports GOOGLE_APPLICATION_CREDENTIALS (used by firebase-tools) and
      # authenticates gcloud; credentials are cleaned up in the action's
      # post step.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Deploys hosting, functions, Firestore rules + indexes, and Storage
      # rules in one shot. The functions predeploy hook (firebase.json)
      # compiles TypeScript before upload.
      - name: Deploy to Firebase
        run: >
          npx firebase-tools deploy
          --only hosting,functions,firestore,storage
          --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}"
          --non-interactive --force

      # firebase-tools only grants public (unauthenticated) invocation to
      # callable functions when it CREATES them — updates never touch IAM,
      # and the firebase-functions SDK drops the `invoker` option for
      # onCall. If a deploy ever fails mid-create, the function is left
      # rejecting browser preflights with 403 (surfacing as a CORS error).
      # Asserting the binding here on every deploy makes that self-healing.
      # The callables still enforce Firebase Auth in their handlers.
      - name: Ensure callable functions allow unauthenticated invocation
        run: |
          for service in createshop receiveorder; do
            gcloud run services add-iam-policy-binding "$service" \
              --project="${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
              --region=us-central1 \
              --member=allUsers \
              --role=roles/run.invoker \
              --quiet
          done
